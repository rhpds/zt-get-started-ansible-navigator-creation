---
# By default egress traffic is not allowed, define below the ports allowed.
egress:
  - ports:
      - protocol: TCP
        port: 22    # SSH for Ansible control
      - protocol: TCP
        port: 80    # HTTP for package repos
      - protocol: TCP
        port: 443   # HTTPS for package repos and registries
      - protocol: TCP
        port: 8443  # code-server web interface
      - protocol: UDP
        port: 53    # DNS resolution

# Ingress traffic rules
ingress:
  - from:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: showroom
    ports:
      - protocol: TCP
        port: 8443  # Allow showroom pod to reach code-server on VMs
