---
containers: []
virtualmachines:
  - name: "host1"
    image: "rhel-9.5"
    memory: "8G"
    cores: 1
    image_size: "40G"
    tags:
      - key: "AnsibleGroup"
        value: "isolated"
    networks:
      - default
    userdata: |-
      #cloud-config
      user: rhel
      password: ansible123!
      chpasswd: { expire: False }
      ssh_pwauth: true
      runcmd:
        - mkdir -p /home/rhel/ansible-files
        - chown rhel:rhel /home/rhel/ansible-files
        - curl -fsSL https://code-server.dev/install.sh | sh
        - systemctl enable --now code-server@rhel
        - sed -i 's/127.0.0.1:8080/0.0.0.0:8443/g' /home/rhel/.config/code-server/config.yaml
        - "sed -i 's|password:.*|password: ansible123!|g' /home/rhel/.config/code-server/config.yaml"
        - systemctl restart code-server@rhel
