---
containers: []
virtualmachines:
  - name: "host1"
    image: "rhel-9.5"
    memory: "8G"
    cores: 1
    image_size: "40G"
    tags:
      - key: "AnsibleGroup"
        value: "isolated"
    networks:
      - default
    userdata: |-
      #cloud-config
      user: rhel
      password: ansible123!
      chpasswd: { expire: False }
      ssh_pwauth: true
      write_files:
        - path: /home/rhel/.config/code-server/config.yaml
          owner: rhel:rhel
          permissions: '0644'
          content: |
            bind-addr: 0.0.0.0:8443
            auth: password
            password: ansible123!
            cert: false
      runcmd:
        - mkdir -p /home/rhel/ansible-files
        - chown rhel:rhel /home/rhel/ansible-files
        - curl -fsSL https://code-server.dev/install.sh | sh
        - systemctl enable --now code-server@rhel
