---
# Secrets and sensitive configuration for Ansible Navigator lab
# These will be injected as environment variables or mounted as secrets

secrets:
  - name: "lab_ssh_key"
    type: "ssh_key"
    path: "/app/.ssh/labkey.pem"
    description: "SSH private key for Ansible control node authentication"

  - name: "ansible_user"
    type: "credential"
    value: "rhel"
    description: "Ansible user for control node"

  - name: "quay_registry_token"
    type: "registry_token"
    description: "Token for pulling execution environment images from quay.io (optional if images are pre-pulled)"
    value: "${QUAY_TOKEN}"  # Set at deployment time

environment_variables:
  ANSIBLE_CONFIG: "/home/rhel/ansible-files/ansible-navigator.yml"
  ANSIBLE_INVENTORY: "/home/rhel/ansible-files/hosts"
  EXECUTION_ENVIRONMENT_IMAGE: "quay.io/acme_corp/first_playbook_ee:latest"
