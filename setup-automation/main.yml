---
- name: Create inventory
  hosts: localhost
  gather_facts: false
  tasks:
  - name: Add bastion host
    ansible.builtin.add_host:
      name: "{{ lookup('ansible.builtin.env', 'BASTION_HOST') }}"
      ansible_ssh_host: "{{ lookup('ansible.builtin.env', 'BASTION_HOST') }}"
      ansible_ssh_port: "{{ lookup('ansible.builtin.env', 'BASTION_PORT') }}"
      ansible_ssh_user: "{{ lookup('ansible.builtin.env', 'BASTION_USER') }}"
      ansible_ssh_pass: "{{ lookup('ansible.builtin.env', 'BASTION_PASSWORD') }}"
      ansible_become_password: "{{ lookup('ansible.builtin.env', 'BASTION_PASSWORD') }}"
  - name: Add nodes
    ansible.builtin.add_host:
      name: "{{ item }}"
      ansible_ssh_host: "{{ item }}"
      ansible_ssh_port: "{{ lookup('ansible.builtin.env', 'BASTION_PORT') }}"
      ansible_ssh_user: "{{ lookup('ansible.builtin.env', 'BASTION_USER') }}"
      ansible_ssh_pass: "{{ lookup('ansible.builtin.env', 'BASTION_PASSWORD') }}"
      ansible_python_interpreter: /usr/libexec/platform-python
    loop:
      - vscode
- name: Demo Playbook for the ansible-runner API
  hosts: all:!localhost
  gather_facts: false
  vars:
    satellite_url: "{{ lookup('ansible.builtin.env', 'SATELLITE_URL') }}"
    satellite_org: "{{ lookup('ansible.builtin.env', 'SATELLITE_ORG') }}"
    satellite_activationkey: "{{ lookup('ansible.builtin.env', 'SATELLITE_ACTIVATIONKEY') }}"
  tasks:
  - name: "waiting for the port tcp/22 to be open"
    ansible.builtin.wait_for_connection:

  - name: Set config_host variable with ansible_host value
    set_fact:
      config_host: "{{ ansible_host }}"

  - name: Create a directory if it does not exist
    ansible.builtin.file:
      path: "/tmp/setup-scripts/"
      state: directory
      mode: '0755'

  - name: Check if setup-server.sh exists
    ansible.builtin.stat:
      path: "./setup-{{ config_host }}.sh"
    delegate_to: localhost
    register: r_script_test

  - name: Copy script file
    when: r_script_test.stat.exists
    copy:
      src: "./setup-{{ ansible_host }}.sh"
      dest: "/tmp/setup-scripts/setup-{{ ansible_host }}.sh"
    register: r_result

  - name: Execute setup-node.sh if it exists
    when: r_script_test.stat.exists
    shell: "sh -x /tmp/setup-scripts/setup-{{ ansible_host }}.sh > /tmp/setup-scripts/setup-{{ ansible_host }}.log 2>&1"
    become: true
    register: r_result
    environment:
      SATELLITE_URL: "{{ satellite_url }}"
      SATELLITE_ORG: "{{ satellite_org }}"
      SATELLITE_ACTIVATIONKEY: "{{ satellite_activationkey }}"

  - name: Output script result
    ansible.builtin.debug:
      var: r_result.stdout
    when: r_script_test.stat.exists

  - name: Write script result to file
    ansible.builtin.copy:
      content: "{{ r_result.stdout | default(r_result.stderr) | default(r_result) }}"
      dest: "/tmp/{{ ansible_host }}-setup-script.out"
    delegate_to: localhost
    when:
    - r_result is defined

  - name: Output script result
    ansible.builtin.debug:
      var: r_result
    when: r_result is defined

  - name: Create ansible-files directory
    ansible.builtin.file:
      path: /home/rhel/ansible-files
      state: directory
      owner: rhel
      group: rhel
      mode: '0755'

  - name: Check if code-server is installed
    ansible.builtin.command: which code-server
    register: code_server_check
    failed_when: false
    changed_when: false

  - name: Download code-server install script
    ansible.builtin.get_url:
      url: https://code-server.dev/install.sh
      dest: /tmp/install-code-server.sh
      mode: '0755'
    when: code_server_check.rc != 0

  - name: Run code-server installer
    ansible.builtin.shell: sh /tmp/install-code-server.sh
    become: true
    when: code_server_check.rc != 0

  - name: Create code-server config directory
    ansible.builtin.file:
      path: /home/rhel/.config/code-server
      state: directory
      owner: rhel
      group: rhel
      mode: '0755'

  - name: Check if code-server service is running
    ansible.builtin.systemd:
      name: code-server@rhel
    register: code_server_service
    become: true
    failed_when: false

  - name: Stop code-server service if running
    ansible.builtin.systemd:
      name: code-server@rhel
      state: stopped
    become: true
    when: code_server_service.status.ActiveState is defined

  - name: Create code-server config file
    ansible.builtin.copy:
      dest: /home/rhel/.config/code-server/config.yaml
      owner: rhel
      group: rhel
      mode: '0600'
      content: |
        bind-addr: 0.0.0.0:8080
        auth: password
        password: ansible123!
        cert: false
        vscode-option:
          - file-watcher-polling=500
          - default-folder=/home/rhel/ansible-files

  - name: Create code-server user settings directory
    ansible.builtin.file:
      path: /home/rhel/.local/share/code-server/User
      state: directory
      owner: rhel
      group: rhel
      mode: '0700'

  - name: Create code-server user settings
    ansible.builtin.copy:
      dest: /home/rhel/.local/share/code-server/User/settings.json
      owner: rhel
      group: rhel
      mode: '0644'
      content: |
        {
          "terminal.integrated.cwd": "/home/rhel/ansible-files"
        }

  - name: Enable and restart code-server service
    ansible.builtin.systemd:
      name: code-server@rhel
      enabled: true
      state: restarted
      daemon_reload: true
    become: true

  - name: Wait for code-server to be ready
    ansible.builtin.wait_for:
      port: 8080
      host: 0.0.0.0
      timeout: 30
      delay: 2
    ignore_errors: true

  - name: Check code-server service status
    ansible.builtin.systemd:
      name: code-server@rhel
    register: final_service_status
    become: true
    failed_when: false

  - name: Display code-server service status
    ansible.builtin.debug:
      var: final_service_status.status.ActiveState

  - name: Fail if stage was failed
    ansible.builtin.fail:
      msg: "Setup failed"
    when:
    - r_result is defined
    - r_result is not skipped
    - r_result.rc is defined
    - r_result.rc != 0
